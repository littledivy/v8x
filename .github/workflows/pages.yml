name: Pages

# Publish the docs site (typst-built, site/) + hill-climb dashboard (/status/)
# to GitHub Pages on site/dashboard changes or manual dispatch. NOTE: routine
# data updates are deployed by the ci.yml `report` job itself (its [skip ci]
# commit can't trigger this workflow). Both call tools/build-site.sh.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/build-site.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C /tmp
          echo "/tmp/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Assemble site (docs + dashboard + data)
        run: tools/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
