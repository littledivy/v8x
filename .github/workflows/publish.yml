name: Publish to crates.io

# Publishes the `v8x` crate to crates.io when a version tag is pushed, so
# releasing no longer depends on one person running `cargo publish` locally.
#
# Release flow:
#   1. Bump `version` in Cargo.toml and land it on main (CI green).
#   2. Tag that commit with `v<version>` and push the tag, e.g.
#        git tag v149.4.0-rc.1 && git push origin v149.4.0-rc.1
#   3. This workflow verifies the tag matches Cargo.toml and publishes.
#
# Requires a repository secret `CARGO_REGISTRY_TOKEN`: a crates.io API token
# (scoped to publish-new + publish-update for `v8x`). Add it once with:
#   gh secret set CARGO_REGISTRY_TOKEN -R littledivy/v8x
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Never run two publishes for the same tag concurrently.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The package embeds the patched QuickJS, WAMR, and rusty_v8 API sources.
      # WebKit remains excluded: it is multi-GB and not used by the portable
      # QuickJS crates.io build.
      - name: Init package submodules
        run: git submodule update --init --depth 1 vendor/rusty_v8 vendor/quickjs-ng vendor/wamr

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="v8x") | .version')"
          echo "tag=$tag  crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::pushed tag 'v$tag' does not match Cargo.toml version '$crate' — aborting publish"
            exit 1
          fi

      # setup_vendor applies the v8x patches to the initialized submodules.
      # Cargo otherwise treats vendor/rusty_v8 as a nested package and omits its
      # Rust API sources from the outer crate, so hide its manifest while both
      # the verification package and published package are assembled.
      - name: Verify packaged QuickJS build
        run: |
          set -euo pipefail
          cargo check --locked --no-default-features --features quickjs
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "v8x") | .version')"
          mv vendor/rusty_v8/Cargo.toml vendor/rusty_v8/Cargo.toml.v8x-package
          cargo package --locked --allow-dirty --no-verify
          package_dir="$(mktemp -d)"
          tar -xzf "target/package/v8x-${version}.crate" -C "$package_dir"
          crate_dir="$package_dir/v8x-${version}"
          test -f "$crate_dir/vendor/rusty_v8/src/lib.rs"
          test -f "$crate_dir/vendor/quickjs-ng/quickjs.c"
          test -f "$crate_dir/vendor/wamr/core/iwasm/common/wasm_runtime_common.c"
          CARGO_TARGET_DIR="$package_dir/target" cargo check --locked \
            --manifest-path "$crate_dir/Cargo.toml" \
            --no-default-features --features quickjs

      # The extracted package was built explicitly above. Keep --no-verify so
      # cargo does not try the macOS-only default JSC backend on this Linux job.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify --locked --allow-dirty
