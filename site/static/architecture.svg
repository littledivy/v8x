<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 285" font-family="Helvetica, Arial, sans-serif">
  <!-- Recreated from the vmil-2026 paper, fig:abi-cut (TikZ in submission/main.tex) -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- host runtime -->
  <rect x="150" y="14" width="460" height="34" rx="4" fill="#fff" stroke="#555" stroke-width="1.1"/>
  <text x="380" y="35" text-anchor="middle" font-size="12.5">host runtime&#160;&#160;<tspan fill="#666" font-size="11">(deno_core is the intended consumer)</tspan></text>

  <line x1="380" y1="48" x2="380" y2="60" stroke="#333" stroke-width="0.9" marker-end="url(#arr)"/>

  <!-- rusty_v8 Rust API -->
  <rect x="150" y="62" width="460" height="34" rx="4" fill="#fff" stroke="#555" stroke-width="1.1"/>
  <text x="380" y="83" text-anchor="middle" font-size="12.5"><tspan font-family="Menlo, monospace" font-size="11.5">rusty_v8</tspan> Rust API: scopes, handles, callbacks, modules</text>

  <!-- generated native ABI (the red line) -->
  <line x1="150" y1="122" x2="712" y2="122" stroke="#b03434" stroke-width="1.6"/>
  <rect x="298" y="113" width="164" height="17" fill="#fff"/>
  <text x="380" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f2727">generated native ABI</text>
  <text x="380" y="143" text-anchor="middle" font-size="10" fill="#666">build-time choice: one backend</text>

  <!-- examples note, left of the line -->
  <text x="10" y="112" font-size="10" fill="#555">examples:</text>
  <text x="10" y="125" font-size="10" fill="#555" font-family="Menlo, monospace">v8__String__NewFromUtf8</text>
  <text x="10" y="138" font-size="10" fill="#555" font-family="Menlo, monospace">v8__Script__Run</text>

  <!-- arrows into the two backends -->
  <line x1="265" y1="122" x2="265" y2="152" stroke="#333" stroke-width="0.9" marker-end="url(#arr)"/>
  <line x1="495" y1="122" x2="495" y2="152" stroke="#333" stroke-width="0.9" marker-end="url(#arr)"/>

  <!-- backend adapters -->
  <rect x="150" y="154" width="230" height="42" rx="4" fill="#fff" stroke="#555" stroke-width="1.1"/>
  <text x="265" y="171" text-anchor="middle" font-size="12" font-weight="bold">v8x adapter + side state</text>
  <text x="265" y="188" text-anchor="middle" font-size="11.5">JavaScriptCore</text>

  <rect x="380" y="154" width="230" height="42" rx="4" fill="#fff" stroke="#555" stroke-width="1.1"/>
  <text x="495" y="171" text-anchor="middle" font-size="12" font-weight="bold">v8x adapter + side state</text>
  <text x="495" y="188" text-anchor="middle" font-size="11.5">QuickJS</text>

  <line x1="265" y1="196" x2="265" y2="218" stroke="#333" stroke-width="0.9" marker-end="url(#arr)"/>
  <line x1="495" y1="196" x2="495" y2="218" stroke="#333" stroke-width="0.9" marker-end="url(#arr)"/>

  <!-- engine collection models -->
  <rect x="150" y="220" width="230" height="30" rx="4" fill="#f2f2f2" stroke="#777" stroke-width="1"/>
  <text x="265" y="239" text-anchor="middle" font-size="11.5">tracing GC, protected pointers</text>

  <rect x="380" y="220" width="230" height="30" rx="4" fill="#f2f2f2" stroke="#777" stroke-width="1"/>
  <text x="495" y="239" text-anchor="middle" font-size="11.5">reference counts, tagged values</text>
</svg>
