<!doctype html>
<!-- The hill-climb dashboard, served at /status/ on Pages. Styled to match
     the typst docs site (../main.css, ../chart.js, always deployed together
     by tools/build-site.sh). Data (report.json, history.jsonl) is CI-written
     next to this file. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dashboard · v8x</title>
    <link rel="stylesheet" href="../main.css" />
    <script src="../chart.js"></script>
    <style>
      .hero { font-size: 2.4em; margin: 0.3em 0 0.1em; }
      .hero .of { color: #666; font-size: 0.5em; }
      .meta { color: #666; }
      td.num { font-variant-numeric: tabular-nums; }
      td.num span { color: #666; font-size: 0.9em; }
    </style>
  </head>
  <body>
    <nav>
      <a href="../">v8x</a><span style="white-space: pre-wrap">     </span
      ><a href="../getting-started">getting started</a><span style="white-space: pre-wrap">     </span
      ><a href="../internals">internals</a><span style="white-space: pre-wrap">     </span
      ><a href="./">dashboard</a><span style="white-space: pre-wrap">     </span
      ><a href="https://github.com/littledivy/v8x">github</a>
    </nav>

    <h2>Test dashboard</h2>
    <p class="hero" id="hero">—</p>
    <p class="meta" id="meta">loading…</p>

    <div id="chart"></div>

    <table id="matrix" hidden></table>

    <footer id="foot"><a href="https://github.com/littledivy/v8x">github.com/littledivy/v8x</a></footer>

    <script>
      (async () => {
        const report = await fetch("report.json").then((r) => r.json()).catch(() => null);
        if (!report) {
          document.getElementById("meta").textContent = "no data yet";
          return;
        }
        const { backends, suites, cells } = report;
        let pass = 0, known = 0;
        for (const b of backends) for (const s of suites) {
          const c = cells[b.id][s.id];
          pass += c.pass;
          known += c.total || 0;
        }
        document.getElementById("hero").innerHTML =
          `${pass.toLocaleString()} <span class="of">/ ${known.toLocaleString()} tests passing` +
          (known ? ` (${Math.round((pass / known) * 100)}%)` : "") + `</span>`;
        document.getElementById("meta").innerHTML =
          `across the engine × suite matrix · <code>${report.commit.slice(0, 7)}</code> · ${timeago(report.generated)}`;

        v8xChart(document.getElementById("chart"), "");

        const t = document.getElementById("matrix");
        let h = `<tr><th>engine</th>`;
        for (const s of suites) h += `<th>${s.label}</th>`;
        h += `</tr>`;
        for (const b of backends) {
          h += `<tr><td>${b.label}</td>`;
          for (const s of suites) {
            const c = cells[b.id][s.id];
            h += `<td class="num"><b>${c.pass}</b>${c.total != null ? ` <span>/ ${c.total}</span>` : ""}</td>`;
          }
          h += `</tr>`;
        }
        t.innerHTML = h;
        t.hidden = false;

        function timeago(iso) {
          const s = (Date.now() - new Date(iso)) / 1000;
          if (s < 90) return "just now";
          if (s < 5400) return `${Math.round(s / 60)}m ago`;
          if (s < 129600) return `${Math.round(s / 3600)}h ago`;
          return `${Math.round(s / 86400)}d ago`;
        }
      })();
    </script>
  </body>
</html>
